name: Auto Format on Push

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  format:
    name: Auto-format (black + isort + pylint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run isort
        run: |
          isort .

      - name: Run black
        run: |
          black .

      - name: Run pylint
        run: |
          pylint $(git ls-files '*.py') --fail-under=9.5
