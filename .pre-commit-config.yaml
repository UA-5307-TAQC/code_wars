repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: black
        name: black
        entry: python -m black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: python -m isort
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: python -m flake8
        language: system
        types: [python]
        args: [--config=.flake8]

      - id: pylint
        name: pylint
        entry: python -m pylint
        language: system
        types: [python]
        args:
          - --rcfile=.pylintrc
